services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savesenseai}
      POSTGRES_USER: ${POSTGRES_USER:-savesenseai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savesenseai_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savesenseai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
